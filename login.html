
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#070a12">
    <title>NEXUS | Iniciar sesión</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background:
                radial-gradient(ellipse at top, #14213a 0%, transparent 55%),
                #070a12;
        }

        .login-card {
            width: 100%;
            max-width: 420px;
            padding: 36px;
            border: 1px solid rgba(0, 229, 255, .3);
            border-radius: 18px;
            background: rgba(12, 18, 32, .95);
            box-shadow: 0 0 40px rgba(0, 229, 255, .08);
        }

        .login-brand {
            margin-bottom: 8px;
            color: #00e5ff;
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 5px;
            text-align: center;
        }

        .login-subtitle {
            margin-bottom: 30px;
            color: #aab7cc;
            text-align: center;
            font-size: .9rem;
        }

        .login-card h1 {
            margin-bottom: 24px;
            color: #fff;
            font-size: 1.35rem;
            text-align: center;
        }

        .login-field {
            display: block;
            margin-bottom: 18px;
            color: #dbe5f5;
            font-size: .9rem;
        }

        .login-field input {
            display: block;
            width: 100%;
            box-sizing: border-box;
            margin-top: 8px;
            padding: 13px 14px;
            border: 1px solid #29364d;
            border-radius: 8px;
            outline: none;
            background: #080e1b;
            color: #fff;
            font: inherit;
        }

        .login-field input:focus {
            border-color: #00e5ff;
            box-shadow: 0 0 0 3px rgba(0, 229, 255, .1);
        }

        .login-button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            border: 0;
            border-radius: 8px;
            background: #00e5ff;
            color: #07101a;
            font-weight: 800;
            cursor: pointer;
        }

        .login-button:hover {
            background: #57ffb0;
        }

        .login-message {
            min-height: 22px;
            margin-top: 16px;
            color: #ff8f9a;
            font-size: .9rem;
            text-align: center;
        }

        .login-footer {
            margin-top: 24px;
            color: #8391a8;
            font-size: .8rem;
            text-align: center;
        }

        .login-footer a {
            color: #00e5ff;
            text-decoration: none;
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 26px 20px;
            }
        }
    </style>
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="login-brand">NEXUS</div>
            <p class="login-subtitle">ACADEMIC OS // ACCESO AL SISTEMA</p>

            <h1>Iniciar sesión</h1>

            <form id="loginForm">
                <label class="login-field" for="usuario">
                    Usuario
                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Introduce tu usuario"
                        autocomplete="username"
                        required
                    >
                </label>

                <label class="login-field" for="contrasena">
                    Contraseña
                    <input
                        type="password"
                        id="contrasena"
                        name="contrasena"
                        placeholder="Introduce tu contraseña"
                        autocomplete="current-password"
                        required
                    >
                </label>

                <button class="login-button" type="submit">
                    ACCEDER AL SISTEMA →
                </button>

                <p
                    id="loginMessage"
                    class="login-message"
                    role="alert"
                    aria-live="polite"
                ></p>
            </form>

            <p class="login-footer">
                Sistema académico NEXUS<br>
                <a href="index.html">Volver al menú actual</a>
            </p>
        </section>
    </main>

    <script>
document.getElementById("loginForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const mensaje = document.getElementById("loginMessage");
    const usuario = document.getElementById("usuario").value.trim();
    const contrasena = document.getElementById("contrasena").value;

    mensaje.textContent = "Verificando credenciales...";

    try {
        const respuesta = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                usuario: usuario,
                contrasena: contrasena
            })
        });

        const datos = await respuesta.json();

        if (!respuesta.ok) {
            mensaje.textContent = datos.mensaje || "No se pudo iniciar sesión.";
            return;
        }

        window.location.href = datos.redireccion || "/";
    } catch (error) {
        mensaje.textContent = "No se pudo conectar con el servidor. Comprueba que esté iniciado.";
    }
});
</script>
</body>
</html>
